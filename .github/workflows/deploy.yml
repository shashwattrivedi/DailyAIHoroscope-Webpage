# Builds the site with the day's lines written into the HTML and deploys it to
# Cloudflare Pages. Runs on every push, and daily when the Worker starts it (10:00 UTC,
# right after it publishes the new date). There is no GitHub schedule on purpose:
# GitHub turns off scheduled workflows in a repo with no commits for 60 days.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit)
# and CLOUDFLARE_ACCOUNT_ID.

name: Deploy

on:
  push:
    branches: [main, redesign]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # puppeteer-core draws the link-preview images with the runner's Chrome.
      - run: npm ci
      - run: node scripts/build.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      # Prints "cloudflare-token: <status> <expiry or never>", which the Worker reads from
      # this log for the key check on the dashboard (checkTokens in worker/src/ops.js).
      # User tokens and account tokens are verified at different addresses.
      - name: Check the Cloudflare token
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e '
            const verify = (path) => fetch("https://api.cloudflare.com/client/v4/" + path + "/tokens/verify", { headers: { Authorization: "Bearer " + process.env.CF_TOKEN } }).then((r) => r.json());
            (async () => {
              let r = await verify("user");
              if (!r.success) r = await verify("accounts/" + process.env.CF_ACCOUNT);
              const t = r.result || {};
              console.log("cloudflare" + "-token: " + (t.status || "invalid") + " " + (t.expires_on || "never"));
            })();
          '
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name dailyaihoroscope --branch ${{ github.ref_name }} --commit-hash ${{ github.sha }}
