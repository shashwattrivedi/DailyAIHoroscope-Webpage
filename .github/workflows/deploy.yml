# Builds the site with the day's lines written into the HTML and deploys it to
# Cloudflare Pages. Runs on every push, and daily when the Worker starts it (10:00 UTC,
# right after it publishes the new date). There is no GitHub schedule on purpose:
# GitHub turns off scheduled workflows in a repo with no commits for 60 days.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit)
# and CLOUDFLARE_ACCOUNT_ID.

name: Deploy

on:
  push:
    branches: [main, redesign]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # puppeteer-core draws the link-preview images with the runner's Chrome.
      - run: npm ci
      - run: node scripts/build.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name dailyaihoroscope --branch ${{ github.ref_name }} --commit-hash ${{ github.sha }}
