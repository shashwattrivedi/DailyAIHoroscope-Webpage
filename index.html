<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Daily AI Horoscope</title>
  <meta name="description" content="Twelve horoscope-sounding lines written by an AI every day. No astrology. Does yours still feel true?" />
  <meta property="og:title" content="Daily AI Horoscope" />
  <meta property="og:description" content="Twelve horoscope-sounding lines written by an AI every day. Does yours still feel true?" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#FF6BB5" />
  <meta name="horoscope-api" content="https://dailyaihoroscope-api.shashwatdevai.workers.dev" />
  <!-- Public R2 bucket with each day's lines (data/YYYY-MM-DD.json), cached by the CDN. -->
  <meta name="horoscope-data" content="https://data.dailyaihoroscope.com" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/media/brand/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/media/brand/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preload" href="fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/spacemono-700-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/fonts.css" />
  <!-- Only used when the page has no baked lines for the visitor's date. -->
  <link rel="preconnect" href="https://data.dailyaihoroscope.com" crossorigin />
  <link rel="modulepreload" href="js/social-links.js" />
  <link rel="stylesheet" href="css/site.css" />
  <!-- Google Analytics (loads after the page; see the file). -->
  <script src="js/analytics.js" defer></script>
  <script src="js/timing.js" defer></script>
</head>

<body>
  <div class="app" id="app">
    <svg class="dust" id="dust" aria-hidden="true"></svg>
    <div class="sky" id="sky"></div>
    <div class="tip" id="tip" role="status" hidden>
      <span id="tipText"></span>
      <button type="button" id="tipClose" aria-label="Close">×</button>
    </div>

    <header class="top">
      <a class="wordmark" href="index.html">Daily AI Horoscope</a>
      <div class="desk-find" role="group" aria-label="Find your sign">
        <span class="desk-find-label">Don’t know your sign?</span>
        <label><span class="sr">Birth month</span><select id="deskMonth"></select></label>
        <label><span class="sr">Birth day</span><select id="deskDay"></select></label>
      </div>
      <span class="date-pill" id="datePill"></span>
    </header>

    <nav class="chips" id="chips" aria-label="Signs"></nav>

    <div class="finder" id="finder">
      <button type="button" class="sign-bar" id="openSheet" aria-haspopup="dialog">
        <span class="sign-bar-text">
          <span class="mono" id="barDates"></span>
          <span class="sign-bar-name" id="barName"></span>
        </span>
        <span class="all-signs">
          All signs
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="4" height="4" rx="1"/><rect x="6" y="1" width="4" height="4" rx="1"/><rect x="11" y="1" width="4" height="4" rx="1"/><rect x="1" y="6" width="4" height="4" rx="1"/><rect x="6" y="6" width="4" height="4" rx="1"/><rect x="11" y="6" width="4" height="4" rx="1"/><rect x="1" y="11" width="4" height="4" rx="1"/><rect x="6" y="11" width="4" height="4" rx="1"/><rect x="11" y="11" width="4" height="4" rx="1"/></svg>
        </span>
      </button>
      <div class="stepper">
        <button type="button" class="round" id="prev"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="dots" id="dots" aria-hidden="true"></div>
        <button type="button" class="round" id="next"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>

    <div class="gap" id="gap"></div>

    <main class="card" id="card">
      <div class="card-head">
        <div class="name-wrap">
          <span class="mono born" id="born"></span>
          <h1 id="signName"></h1>
        </div>
      </div>
      <div class="quote-box" id="quoteBox" aria-live="polite">
        <blockquote class="quote" id="quote"></blockquote>
      </div>
    </main>

    <footer class="actions" id="actions">
      <!-- One button that asks first (app.js): "Felt true? Yes / No", then Share (yes) or
           "Not today, maybe tomorrow" (no). The Worker records which model wrote the line. -->
      <div class="decide" id="decide" data-step="ask">
        <div class="ask-row" id="askRow">
          <div class="ask" role="group" aria-labelledby="askQ">
            <span class="ask-q" id="askQ">Felt true?</span>
            <button type="button" class="vote-btn" data-felt="1">Yes</button>
            <button type="button" class="vote-btn" data-felt="0">No</button>
          </div>
          <button type="button" class="round-btn" id="quickShare" aria-label="Share" title="Share">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
          </button>
        </div>
        <div class="answered" id="answered" hidden>
          <div class="result">
            <span class="result-mark" aria-hidden="true">
              <svg class="mark-yes" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>
              <svg class="mark-no" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </span>
            <span class="result-text" id="resultText" aria-live="polite"></span>
            <button type="button" class="undo" id="undoVote">Undo</button>
          </div>
          <div class="share-row">
            <button type="button" class="share" id="share">
              <svg class="if-yes" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
              <svg class="if-no" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
              <span id="shareLabel">Share it</span>
            </button>
            <button type="button" class="save" id="save" aria-label="Save as image" title="Save as image">
              <svg class="if-yes" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>
              <svg class="if-no" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="follow-row" id="followRow">
        <div class="follow-icons" aria-label="Follow Daily AI Horoscope"><!-- FOLLOW_LINKS --></div>
        <!-- The widget for other sites; app.js adds the sign shown (?sign=). -->
        <a class="get-widget" id="getWidget" data-from="home" href="embed.html">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg>
          Add to your site
        </a>
      </div>
      <a class="why" href="purpose.html">
        <span class="why-text">
          <span class="why-kicker">WRITTEN BY AI · NOT THE STARS</span>
          <span class="why-title">Why does it still feel true?</span>
        </span>
        <span class="why-arrow" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
    </footer>

    <div class="sheet-wrap" id="sheet" hidden>
      <button type="button" class="scrim" id="scrim" aria-label="Close" tabindex="-1"></button>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-head">
          <h2 id="sheetTitle">Pick your sign</h2>
          <button type="button" class="close" id="closeSheet" aria-label="Close">×</button>
        </div>
        <div class="birthday">
          <label class="bm">BIRTH MONTH<select id="sheetMonth"></select></label>
          <label class="bd">DAY<select id="sheetDay"></select></label>
        </div>
        <div class="tiles" id="tiles"></div>
        <a class="sheet-widget" id="sheetWidget" data-from="sheet" href="embed.html">
          <span><b>Free widget</b> Your sign’s daily line on your website, blog or Notion</span>
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </div>
  </div>

  <!-- defer: the page (with today's lines) paints without waiting for them; they still
       run in this order, before app.js. -->
  <script src="js/astronomy.browser.min.js" defer></script>
  <script src="js/constellations.js" defer></script>
  <script src="js/signs.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>

</html>
