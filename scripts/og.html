<!DOCTYPE html>
<html lang="en">
<!-- Used by build.mjs (in headless Chrome) to draw the 1200x630 link-preview image
     for each sign. Same look as the share card in js/app.js, laid out landscape. -->
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=Space+Mono:wght@700&display=block" rel="stylesheet" />
</head>
<body>
  <script src="../js/signs.js"></script>
  <script src="../js/constellations.js"></script>
  <script>
    function seeded(n, w, h) {
      let s = 7;
      const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
      return Array.from({ length: n }, () => ({ x: r() * w, y: r() * h, r: 0.6 + r() * 1.4, o: 0.35 + r() * 0.6 }));
    }

    function wrap(ctx, text, maxW) {
      const words = text.split(' '), out = [];
      let line = '';
      words.forEach((w) => {
        const t = line ? line + ' ' + w : w;
        if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
      });
      if (line) out.push(line);
      return out;
    }

    function socialIcon(ctx, platform, x, y, size, color) {
      const k = size / 24;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(k, k);
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (platform === 'instagram') {
        ctx.beginPath(); ctx.roundRect(3, 3, 18, 18, 5); ctx.stroke();
        ctx.beginPath(); ctx.arc(12, 12, 4, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(17.5, 6.5, 1, 0, Math.PI * 2); ctx.fill();
      } else if (platform === 'facebook') {
        ctx.beginPath(); ctx.moveTo(15, 21); ctx.lineTo(15, 13); ctx.lineTo(18, 13);
        ctx.lineTo(18.5, 9); ctx.lineTo(15, 9); ctx.lineTo(15, 7);
        ctx.bezierCurveTo(15, 5.8, 15.4, 5, 17, 5); ctx.lineTo(18.7, 5);
        ctx.lineTo(18.7, 1.4); ctx.bezierCurveTo(17.9, 1.2, 16.8, 1, 15.5, 1);
        ctx.bezierCurveTo(12.3, 1, 10, 2.9, 10, 6.5); ctx.lineTo(10, 9);
        ctx.lineTo(7, 9); ctx.lineTo(7, 13); ctx.lineTo(10, 13); ctx.lineTo(10, 21);
        ctx.closePath(); ctx.fill();
      } else if (platform === 'bluesky') {
        ctx.beginPath(); ctx.moveTo(12, 12);
        ctx.bezierCurveTo(9, 8, 4.4, 4.2, 2.7, 5.1);
        ctx.bezierCurveTo(1.1, 5.9, 2.2, 10.5, 4.2, 12.3);
        ctx.bezierCurveTo(5.8, 13.8, 8.2, 13.9, 12, 12);
        ctx.bezierCurveTo(8.2, 13.9, 6.8, 15.7, 7.4, 17.6);
        ctx.bezierCurveTo(8, 19.4, 10, 19.4, 12, 15.5);
        ctx.bezierCurveTo(14, 19.4, 16, 19.4, 16.6, 17.6);
        ctx.bezierCurveTo(17.2, 15.7, 15.8, 13.9, 12, 12);
        ctx.bezierCurveTo(15.8, 13.9, 18.2, 13.8, 19.8, 12.3);
        ctx.bezierCurveTo(21.8, 10.5, 22.9, 5.9, 21.3, 5.1);
        ctx.bezierCurveTo(19.6, 4.2, 15, 8, 12, 12);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawFooter(ctx, links, site, x, y, size) {
      let iconX = x;
      links.forEach(({ platform }) => {
        socialIcon(ctx, platform, iconX, y, size, '#111111');
        iconX += size + 8;
      });
      ctx.font = '700 ' + size + 'px "Space Mono"';
      ctx.fillText(links[0].handle + ' · ' + site, iconX + 4, y);
    }

    // Three layouts: 'og' is the 1200x630 link preview (PNG); 'post' is the 1080x1350 (4:5)
    // card for Instagram, which only takes JPEG; 'story' is the 1080x1920 (9:16) Instagram
    // story, with everything between y 250 and 1670, clear of the app's overlays.
    const LAYOUT = {
      og: { W: 1200, H: 630, P: 64, sky: { x: 620, y: 40, w: 540, h: 550 }, word: 34, pill: [24, 50], born: 160, name: [120, 640, 192],
        quote: [52, 335, 210], foot: 22, stars: 70, type: 'image/png' },
      post: { W: 1080, H: 1350, P: 80, sky: { x: 40, y: 150, w: 1000, h: 640 }, word: 40, pill: [28, 56], born: 830, name: [150, 920, 868],
        quote: [60, 1040, 230], foot: 26, stars: 90, type: 'image/jpeg' },
      story: { W: 1080, H: 1920, P: 80, top: 290, sky: { x: 40, y: 390, w: 1000, h: 620 }, word: 40, pill: [28, 56], born: 1060, name: [150, 920, 1100],
        quote: [60, 1290, 280], foot: 30, footY: 1620, stars: 130, type: 'image/jpeg' }
    };

    // date: 'WED 21 OCT'; line may be empty (then a generic tagline is shown).
    window.drawCard = async function (layout, key, date, line, site, links) {
      const L = LAYOUT[layout], { W, H, P } = L, top = L.top || P;
      const s = SIGNS.find((x) => x.key === key), c = window.CONSTELLATIONS[key];
      await Promise.all(['800 34px Outfit', '900 120px Outfit', '700 24px "Space Mono"'].map((f) => document.fonts.load(f)));
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');

      ctx.fillStyle = s.color;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#FFFFFF';
      seeded(L.stars, W, H).forEach((f) => { ctx.globalAlpha = f.o; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 1.5, 0, 7); ctx.fill(); });
      ctx.globalAlpha = 1;

      const [vx, vy, vw, vh] = c.vb;
      const area = L.sky;
      const k = Math.min(area.w / vw, area.h / vh);
      const ox = area.x + (area.w - vw * k) / 2 - vx * k, oy = area.y + (area.h - vh * k) / 2 - vy * k;
      ctx.shadowColor = 'rgba(255,255,255,0.8)';
      ctx.shadowBlur = 12;
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = Math.max(2, 3 * k);
      ctx.lineCap = 'round';
      c.l.forEach((l) => { ctx.beginPath(); ctx.moveTo(ox + l[0] * k, oy + l[1] * k); ctx.lineTo(ox + l[2] * k, oy + l[3] * k); ctx.stroke(); });
      c.s.forEach((p) => { ctx.beginPath(); ctx.arc(ox + p[0] * k, oy + p[1] * k, Math.max(3, p[2] * 1.2 * k), 0, 7); ctx.fill(); });
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#111111';
      ctx.textBaseline = 'top';
      ctx.font = '800 ' + L.word + 'px Outfit';
      ctx.fillText('Daily AI Horoscope', P, top - 8);
      const [ps, ph] = L.pill;
      ctx.font = '700 ' + ps + 'px "Space Mono"';
      const dw = ctx.measureText(date).width + 40;
      ctx.beginPath(); ctx.roundRect(W - P - dw, top - 14, dw, ph, ph / 2); ctx.fill();
      ctx.fillStyle = s.color;
      ctx.fillText(date, W - P - dw + 20, top - 14 + (ph - ps) / 2 + 1);

      ctx.fillStyle = '#111111';
      ctx.font = '700 ' + ps + 'px "Space Mono"';
      ctx.fillText('BORN ' + s.dates, P, L.born);
      const [nameMax, nameW, nameY] = L.name;
      let nameSize = nameMax;
      ctx.font = '900 ' + nameMax + 'px Outfit';
      while (ctx.measureText(s.name).width > nameW && nameSize > 60) ctx.font = '900 ' + (nameSize -= 4) + 'px Outfit';
      ctx.fillText(s.name, P - 5, nameY + (nameMax - nameSize) * 0.6);

      const [qMax, qY, qH] = L.quote;
      const text = line ? '“' + line + '”' : 'Written by AI, not the stars. Does it still feel true?';
      let size = qMax, lines;
      do {
        ctx.font = '800 ' + size + 'px Outfit';
        lines = wrap(ctx, text, W - P * 2);
        size -= 2;
      } while (lines.length * (size + 2) * 1.12 > qH && size > 26);
      const lh = (size + 2) * 1.12;
      lines.forEach((l, i) => ctx.fillText(l, P, qY + i * lh));

      drawFooter(ctx, links, site, P, L.footY || H - P + 8, L.foot);
      return cv.toDataURL(L.type, 0.92);
    };

    // Saturn ♄, the brand mark (media/brand), as strokes on an 800 grid scaled by k.
    function saturn(ctx, k, cx, cy) {
      const p = (x, y) => [cx + (x - 400) * k, cy + (y - 400) * k];
      ctx.beginPath();
      ctx.moveTo(...p(330, 130)); ctx.lineTo(...p(330, 640));
      ctx.moveTo(...p(225, 240)); ctx.lineTo(...p(440, 240));
      ctx.moveTo(...p(330, 470));
      ctx.bezierCurveTo(...p(380, 370), ...p(560, 350), ...p(555, 475));
      ctx.bezierCurveTo(...p(552, 560), ...p(455, 590), ...p(470, 660));
      ctx.bezierCurveTo(...p(480, 705), ...p(545, 705), ...p(580, 668));
    }

    // First slide of the Instagram carousel (1080x1350 JPEG): what the post is, and
    // "swipe" to the 12 sign cards. key: the sign of the season, for the colour.
    // story: the same for the first story (1080x1920), centred in the safe area, "tap".
    window.drawCover = async function (key, date, site, story, links) {
      const W = 1080, H = 1350, P = 80, s = SIGNS.find((x) => x.key === key), full = story ? 1920 : H;
      await Promise.all(['800 40px Outfit', '900 140px Outfit', '700 28px "Space Mono"'].map((f) => document.fonts.load(f)));
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = full;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = s.color;
      ctx.fillRect(0, 0, W, full);
      ctx.fillStyle = '#FFFFFF';
      seeded(story ? 160 : 110, W, full).forEach((f) => { ctx.globalAlpha = f.o; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 1.5, 0, 7); ctx.fill(); });
      ctx.globalAlpha = 1;
      ctx.translate(0, (full - H) / 2);

      ctx.fillStyle = '#111111';
      ctx.textBaseline = 'top';
      ctx.font = '800 40px Outfit';
      ctx.fillText('Daily AI Horoscope', P, P - 8);
      ctx.font = '700 28px "Space Mono"';
      const dw = ctx.measureText(date).width + 40;
      ctx.beginPath(); ctx.roundRect(W - P - dw, P - 14, dw, 56, 28); ctx.fill();
      ctx.fillStyle = s.color;
      ctx.fillText(date, W - P - dw + 20, P - 14 + 15);

      ctx.strokeStyle = '#111111'; ctx.lineWidth = 46; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      saturn(ctx, 0.5, W / 2, 330); ctx.stroke();

      ctx.fillStyle = '#111111';
      ctx.font = '900 140px Outfit';
      ctx.fillText('Today’s 12', P - 6, 560);
      ctx.fillText('horoscopes', P - 6, 700);
      ctx.font = '800 44px Outfit';
      ctx.fillText('Written by an AI, not the stars.', P, 860);

      // The 12 signs as colour dots, in the order of the slides.
      const n = 6, gap = (W - P * 2) / n, r = 34;
      SIGNS.forEach((x, i) => {
        const cx = P + gap * (i % n) + gap / 2, cy = 995 + Math.floor(i / n) * 110;
        ctx.fillStyle = x.color; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
        ctx.strokeStyle = '#111111'; ctx.lineWidth = 4; ctx.stroke();
        ctx.fillStyle = '#111111'; ctx.font = '700 18px "Space Mono"'; ctx.textAlign = 'center';
        ctx.fillText(x.name.slice(0, 3).toUpperCase(), cx, cy + r + 8);
        ctx.textAlign = 'left';
      });

      ctx.font = '700 28px "Space Mono"';
      const swipe = (story ? 'TAP' : 'SWIPE') + '  →  FIND YOUR SIGN', sw = ctx.measureText(swipe).width + 48;
      ctx.beginPath(); ctx.roundRect(W - P - sw, H - P - 40, sw, 64, 32); ctx.fill();
      ctx.fillStyle = s.color; ctx.fillText(swipe, W - P - sw + 24, H - P - 40 + 19);
      drawFooter(ctx, links, site, P, H - P - 18, 26);
      return cv.toDataURL('image/jpeg', 0.92);
    };
  </script>
</body>
</html>
